name: Kadr
options:
  bundleIdPrefix: app.kadr
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Kadr:
    type: application
    platform: iOS
    sources:
      - path: Kadr
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Кадр
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBG
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryAddUsageDescription: "Кадр сохраняет готовые фото в вашу галерею."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kadr.editor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
